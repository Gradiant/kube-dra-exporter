name: Validate

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Test and check Go
        run: |
          go test -race ./...
          go vet ./...
          go build ./...
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chart test dependencies
        run: python -m pip install PyYAML==6.0.2
      - name: Validate release versions
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python scripts/check_release.py --release-tag "$GITHUB_REF_NAME"
          else
            python scripts/check_release.py
          fi
      - name: Validate Helm chart
        run: |
          helm lint deploy/helm/kube-dra-exporter --strict
          helm lint deploy/helm/kube-dra-exporter --strict --set networkPolicy.enabled=true,podDisruptionBudget.enabled=true,prometheus.podmonitor.enabled=true
          helm lint deploy/helm/kube-dra-exporter --strict -f deploy/helm/kube-dra-exporter/prod-values.yaml --set networkPolicy.enabled=true
          python -m unittest discover -s tests -v
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build all supported image architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/riscv64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
