name: Release image and Helm chart

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    uses: ./.github/workflows/validate.yaml

  publish-image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image repository and version
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=${{ env.RELEASE_VERSION }}
          labels: org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push all image architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/riscv64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-chart:
    # Publish the chart only after its default image is available.
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHART_PATH: deploy/helm/kube-dra-exporter
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Set chart destination and version
        run: |
          echo "CHART_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        env:
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$PACKAGE_TOKEN" | helm registry login "$REGISTRY" \
            --username "$GITHUB_ACTOR" --password-stdin
      - name: Package and push Helm chart
        run: |
          mkdir -p .dist
          helm package "$CHART_PATH" \
            --version "$RELEASE_VERSION" \
            --app-version "$RELEASE_VERSION" \
            --destination .dist
          helm push ".dist/kube-dra-exporter-${RELEASE_VERSION}.tgz" \
            "oci://${REGISTRY}/${CHART_OWNER}/charts"
