{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
{{- with .Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
metadata:
  name: {{ template "kube-dra-exporter.serviceAccountName" . }}
  namespace: {{ include "kube-dra-exporter.namespace" . }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- range $k, $v := . }}
      {{- $value := $v | quote }}
      {{- printf "%s: %s" (tpl $k $) (tpl $value $) | nindent 4 }}
    {{- end }} 
  {{- end }}
  labels:
    app: {{ include "kube-dra-exporter.name" . }}
    app.kubernetes.io/name: {{ include "kube-dra-exporter.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: "controller"
    {{- include "labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}